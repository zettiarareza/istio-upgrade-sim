---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sim-istio-gateway
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: 'https://istio-release.storage.googleapis.com/charts'
      chart: gateway
      targetRevision: 1.21.6   # <-- ganti ke 1.18.7 saat simulasi upgrade
      helm:
        releaseName: istio-ingressgateway
        valueFiles:
          - $values/manifests/istio-deployment/istio-gateway/values.yaml
    - repoURL: 'git@github.com:zettiarareza/istio-upgrade-sim.git'
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - CreateNamespace=true