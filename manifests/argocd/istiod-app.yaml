---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sim-istiod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://istio-release.storage.googleapis.com/charts'
    chart: istiod
    targetRevision: 1.18.7   # <-- ganti ke 1.18.7 saat simulasi upgrade
    helm:
      releaseName: istiod
      values: |
        pilot:
          autoscaleEnabled: false
          replicaCount: 1
          resources:
            requests:
              cpu: 64m
              memory: 128Mi
            limits:
              cpu: 512m
              memory: 512Mi
        global:
          istioNamespace: istio-system
          proxy:
            resources:
              requests:
                cpu: 35m
                memory: 64Mi
              limits:
                cpu: 200m
                memory: 128Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - CreateNamespace=true
