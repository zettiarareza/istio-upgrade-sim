---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sim-istiod
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: 'https://blob.istio.io/istio-release/charts'
      chart: istiod
      targetRevision: 1.31.3   # <-- ganti ke 1.18.7 saat simulasi upgrade
      helm:
        releaseName: istiod
        valueFiles:
          - $values/manifests/istio-deployment/istio-istiod/values.yaml
    - repoURL: 'git@github.com:zettiarareza/istio-upgrade-sim.git'
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    automated:
      prune: false
    syncOptions:
      - CreateNamespace=true
  ignoreDifferences:
    # Known behavior: istiod mem-patch failurePolicy Ignore->Fail saat sehat
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: istiod-default-validator
      jqPathExpressions:
        - '.webhooks[]?.failurePolicy'